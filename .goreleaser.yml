# sling-server release config (goreleaser).
# The frontend is built first (before.hooks), then per-platform single
# binaries are compiled with the UI embedded via go:embed.
# SQLite needs CGO → build on a native OS matrix (same as the CLI CI).
# Local snapshot: goreleaser --snapshot --clean
version: 2

project_name: sling-server

before:
  hooks:
    - cmd: corepack enable && pnpm install --frozen-lockfile
      dir: web
    - cmd: pnpm run build
      dir: web

builds:
  - id: sling-server
    main: ./cmd/sling-server
    binary: sling-server
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # windows/arm64 needs a native CGO cross toolchain; enable as needed
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/slingdata-io/sling-cli/core.Version={{.Version}}

archives:
  - id: sling-server
    ids: [sling-server]
    name_template: "sling-server_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"


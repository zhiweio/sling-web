# CI for the sling-server workbench (server, web UI, e2e).
# The upstream CLI workflows (build-test.yml etc.) run on self-hosted
# runners and are untouched; this workflow uses GitHub-hosted runners.
#
# Trigger policy (keep Actions minutes low):
#   - pull_request: the light jobs (web, lint, unit tests) gate the PR
#     before merge; the merge push itself is not re-tested.
#   - tag push (v*): full suite including the Playwright E2E job.
#   - workflow_dispatch: light jobs only.
# Direct pushes to main never trigger this workflow.
name: Workbench CI

on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "e2e/**"
      - "cmd/sling-server/**"
      - "justfile"
      - ".github/workflows/ci-server.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (i18n + typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check i18n key parity (en / zh-CN)
        run: node scripts/check-i18n.mjs

      - name: Type check
        run: npx tsc -b

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  lint:
    name: Go lint (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # golangci-lint typechecks cmd/sling-server, which embeds web/dist
      # (see the placeholder note in the server-test job).
      - name: Create dist placeholder for go:embed
        run: mkdir -p web/dist && touch web/dist/.placeholder

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14
          args: ./server/... ./cmd/sling-server/...

  server-test:
    name: Server unit tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5

      # web/dist is a build artifact and never committed; the go:embed all:dist
      # in web/embed.go needs at least one file to compile cmd/sling-server.
      - name: Create dist placeholder for go:embed
        run: mkdir -p web/dist && touch web/dist/.placeholder

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./server/... ./cmd/sling-server/...

      - name: go test
        run: go test -count=1 -timeout 600s ./server/... ./cmd/sling-server/...

  build-and-e2e:
    name: Build binary + Playwright E2E
    # Expensive gate: release tags only (see the trigger policy above).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [web]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build frontend
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web run build

      - name: Build sling-server binary
        run: go build -p 1 -ldflags="-s -w" -o cmd/sling-server/sling-server ./cmd/sling-server

      - name: Run Playwright E2E
        run: cd e2e && npm ci && npx playwright install --with-deps chromium && npx playwright test

      - name: Upload binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sling-server-linux-amd64
          path: cmd/sling-server/sling-server
          if-no-files-found: warn

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

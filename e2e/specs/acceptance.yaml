# AI acceptance specs (Given/When/Then).
# Drivers:
#   1) Deterministic Playwright cases generated from the specs (specs/*.spec.ts)
#   2) An AI acceptance agent exploring the product from the specs
#      (see ai/run-acceptance.mjs), producing a JUnit report.
# Every spec needs an id and a priority; failed acceptance checks attach a
# screenshot + trace.

- id: AC-001
  priority: P0
  feature: Overview page
  given: a server with no connections and no jobs
  when: the home page is opened
  then: the sidebar shows Overview/Connections/Jobs/Runs/Settings; an empty-state onboarding card is displayed; stat cards show 0
  then_note: non-technical users understand the "create a connection first" guidance

- id: AC-002
  priority: P0
  feature: Connection wizard
  given: the connections page is open
  when: completing choose type (Local File System) → fill name/path → click Test Connection
  then: a green "Connected" inline feedback appears; the Next button shows up; after saving, the card carries an "Encrypted" badge

- id: AC-003
  priority: P0
  feature: 5-step migration wizard
  given: an existing file source connection and a sqlite target connection
  when: the wizard's 5 steps are completed and "Save + Run Now" is clicked
  then: a destructive confirmation appears (naming the tables that will be dropped and recreated); after confirming, the user lands on the Runs page

- id: AC-004
  priority: P0
  feature: Live run monitoring
  given: a running job
  when: viewing the Runs page
  then: a "Running" card appears with rows/duration refreshing live over SSE; on completion it moves into history showing "Success"

- id: AC-005
  priority: P1
  feature: Log terminal
  given: a completed run
  when: opening the run detail
  then: the metric bar shows rows/duration; the log terminal shows the final rendered text (including insert SQL), searchable and downloadable

- id: AC-006
  priority: P1
  feature: Data correctness
  given: a source CSV with 3 rows
  when: the migration finishes and the data is previewed through the target connection
  then: the target table exists with exactly 3 rows and columns matching the source (metadata columns allowed)

- id: AC-007
  priority: P1
  feature: Scheduled runs
  given: a saved job
  when: a "daily 09:00" schedule is enabled on the edit page and saved
  then: the jobs list shows the schedule badge "daily 09:00" plus a countdown to the next run

- id: AC-008
  priority: P2
  feature: Bilingual UI
  given: the UI in its default language (English)
  when: the language is switched to 简体中文 on the Settings page
  then: all copy switches to Chinese and persists after a reload

- id: AC-009
  priority: P2
  feature: Dark mode
  given: any page
  when: the top-bar theme toggle is clicked
  then: the whole app switches light/dark without visual glitches (the sidebar stays dark)

- id: AC-010
  priority: P2
  feature: Destructive-action guard
  given: a job in "Full Refresh" mode
  when: Run is clicked from the jobs list
  then: no confirmation pops up (the list queues it directly) — confirmation only appears on the wizard's first save-and-run; dangerous actions are always reversible (the cancel-run button works)
